<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salir - Gomería El Puente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="{{ 'modo-milagritos' if milagritos else '' }}">

    <!-- BARRA SUPERIOR -->
    <header class="barra-superior py-3 px-4 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div style="width: 90px;"></div>
            <h1 class="h4 mb-0 text-uppercase fw-bold letter-spacing-1">
                Sistema Cerrado
            </h1>
            <a href="/toggle-milagritos" class="btn btn-modo-milagritos">
                🧚
            </a>
            <img src="/static/logo.png" alt="Gomería El Puente" class="logo-nav">
        </div>
    </header>

    <main class="container py-5 d-flex justify-content-center">
        <div class="tarjeta-formulario p-4 p-md-5 text-center">
            <span class="hada-decorativa" style="font-size: 2.5rem;">🧚</span>
            <h2 class="fs-3 fw-bold mb-3 text-dark">
                ¡Gracias por usar el sistema!
            </h2>
            <p class="text-muted mb-4">
                Ya podés cerrar esta pestaña con tranquilidad.<br>
                Todo lo que cargaste quedó guardado.
            </p>
            <a href="{{ url_for('home') }}" class="btn btn-capsula px-5 shadow-sm text-decoration-none d-inline-block">
                Volver al Inicio
            </a>
        </div>
    </main>

</body>
</html>
