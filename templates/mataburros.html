<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Trabajos - Gomería El Puente</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-azul-fondo {
            background: radial-gradient(circle, #1a42b8 0%, #0a1c5c 100%);
        }
        .btn-accion {
            border: none;
            border-radius: 10px;
            font-weight: bold;
            padding: 10px 25px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            width: 100%;
            max-width: 220px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .tarjeta-formulario {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 550px;
            width: 100%;
        }
        .select-personalizado {
            background-color: #a3bbf5 !important;
            color: #0d1b3e !important;
            border: none !important;
            font-weight: 500;
        }
        .logo-izq {
            max-width: 85%;
            height: auto;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>

    <div class="container-fluid vh-100 p-0 overflow-hidden">
        <div class="row h-100 g-0">
            
            <!-- MITAD IZQUIERDA: Control y Menú (Fondo Gris Claro) -->
            <div class="col-md-4 bg-light d-flex flex-column justify-content-between p-4 align-items-center">
                
                <!-- Botón Atrás arriba a la izquierda -->
                <div class="w-100 text-start">
                    <a href="/" class="btn btn-sm btn-outline-secondary px-3 fw-bold rounded-3">ATRÁS</a>
                </div>

                <!-- Logo de la empresa -->
                <div class="text-center my-3">
                    <img src="/static/logo.jpg" alt="Logo" class="logo-izq">
                </div>

                <!-- Botones de Acción Redondeados -->
                <div class="d-flex flex-column gap-3 w-100 align-items-center pb-4">
                    <button type="button" onclick="agregarFilaTarea()" class="btn btn-accion text-black" style="background-color: #26e646;">+ Agregar Tarea</button>
                    <button type="button" onclick="quitarFilaTarea()" class="btn btn-accion text-white" style="background-color: #e62626;">- Quitar Tarea</button>
                    <button class="btn btn-accion text-white" style="background-color: #0052cc;">Modificar</button>
                </div>
            </div>

            <!-- MITAD DERECHA: Formulario (Fondo Azul Gradiente) -->
            <div class="col-md-8 bg-azul-fondo d-flex justify-content-center align-items-center p-4">
                
                <div class="tarjeta-formulario p-4 p-md-5">
                    <h2 class="fs-3 fw-normal mb-4 text-dark text-start">Formulario de trabajos</h2>
                    
                    <!-- Formulario conectado con el Backend de Flask -->
                    <form action="/enviar-trabajo" method="POST">
                        
                    <!-- Número de Remito (Talonario) -->
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold mb-1">Número de Remito</label>
                        <input type="text" name="remito" class="form-control select-personalizado py-2 shadow-sm" placeholder="Ej: 20213" required>
                    </div>

                    <!-- Nombre de empresa -->
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold mb-1">Nombre de empresa</label>
                        <select name="empresa" class="form-select select-personalizado py-2 shadow-sm" required>
                            <option value="" selected disabled>Selecciona una empresa...</option>
                            
                            <!-- Bucle de Jinja para traer las empresas reales de SQLite -->
                            {% for e in empresas %}
                                <option value="{{ e['id_cliente'] }}">{{ e['nom_cli'] }}</option>
                            {% endfor %}
                            
                        </select>
                    </div>

                    <!-- Tareas Realizadas dinámicas -->
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold mb-1">Tareas realizadas</label>
                        <div id="contenedor-tareas" class="d-flex flex-column gap-2">
                            <select name="tareas" class="form-select select-personalizado py-2 shadow-sm" required>
                                <option value="" selected disabled>Selecciona una tarea...</option>
                                {% for t in tareas %}
                                    <option value="{{ t['id_tarea'] }}">{{ t['nom_tar'] }} - ${{ t['precio'] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                        <!-- Botón Enviar -->
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow mb-3" style="background-color: #1240c2; border: none;">
                            Enviar
                        </button>
                        
                        <!-- Texto aclaratorio inferior -->
                        <div class="text-center text-muted" style="font-size: 0.65rem;">
                            No se va a compartir tu nombre de perfil de Correo. Nunca envíes contraseñas.<br>
                            <a href="#" class="text-decoration-underline text-muted">Obtén más información sobre cómo gestionamos tus datos personales.</a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script>
        function agregarFilaTarea() {
            const contenedor = document.getElementById('contenedor-tareas');
            // Clonamos el primer desplegable de tareas
            const primerSelect = contenedor.querySelector('select');
            const nuevoSelect = primerSelect.cloneNode(true);
            nuevoSelect.selectedIndex = 0; // Lo reseteamos a la opción por defecto
            contenedor.appendChild(nuevoSelect);
        }
        function quitarFilaTarea() {
            const contenedor = document.getElementById('contenedor-tareas');
            const selects = contenedor.querySelectorAll('select');
            // Solo quitamos si hay más de 1 tarea (para no dejarlo sin ninguna)
            if (selects.length > 1) {
                contenedor.removeChild(selects[selects.length - 1]);
            }
        }
    </script>

</body>
</html>
