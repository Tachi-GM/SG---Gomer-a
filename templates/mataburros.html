<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Trabajos - Gomería El Puente</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/estilos.css">
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .barra-superior {
            background-color: #1a42b8;
            color: white;
        }
        .logo-nav {
            max-height: 55px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .tarjeta-formulario {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 650px;
            width: 100%;
        }
        .input-personalizado {
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 500;
            color: #1e293b;
            transition: all 0.2s ease;
        }
        .input-personalizado:focus {
            background-color: #ffffff;
            border-color: #1a42b8;
            box-shadow: 0 0 0 4px rgba(26, 66, 184, 0.15);
        }

        .input-cantidad {
            min-width: 45px;
            width: 45px;
            padding-left: 2px;
            padding-right: 2px;
            text-align: center;
        }
        .input-cantidad::-webkit-inner-spin-button,
        .input-cantidad::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-cantidad {
            -moz-appearance: textfield;
        }
        .btn-accion-tarea {
            font-weight: 600;
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="{{ 'modo-milagritos' if milagritos else '' }}">

    <!-- BARRA SUPERIOR INSTITUCIONAL -->
    <header class="barra-superior py-3 px-4 shadow-sm mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="/" class="btn btn-sm btn-outline-light px-3 fw-bold rounded-pill">
                &larr; ATRÁS
            </a>
            <h1 class="h4 mb-0 text-uppercase fw-bold letter-spacing-1">
                Registro de Trabajos (Mataburros)
            </h1>
            <a href="/toggle-milagritos" class="btn btn-modo-milagritos">
                🧚
            </a>
            <img src="/static/logo.png" alt="Gomería El Puente" class="logo-nav">
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container py-3 d-flex justify-content-center">
        <div class="tarjeta-formulario p-4 p-md-5">
            <h2 class="fs-4 fw-bold mb-4 text-dark text-start border-bottom pb-3">
                <span class="hada-decorativa">✨</span>Nuevo Remito de Trabajo<span class="hada-decorativa">✨</span>            
            </h2>
            
            <form action="/enviar-trabajo" method="POST">
                
                <!-- 1. Número de Remito -->
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-1">Número de Remito (Talonario)</label>
                    <input type="text" name="remito" class="form-control input-personalizado" placeholder="Ej: 20213" required>
                </div>

                <!-- 2. Nombre de Empresa -->
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-1">Empresa / Cliente</label>
                    <select name="empresa" class="form-select input-personalizado" required>
                        <option value="" selected disabled>Selecciona una empresa...</option>
                        {% for e in empresas %}
                            <option value="{{ e['id_cliente'] }}">{{ e['nom_cli'] }} (CUIT: {{ e['cuit'] }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- 3. Tareas Realizadas dinámicas -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label small fw-bold text-secondary text-uppercase mb-0">Tareas Realizadas</label>
                        <div class="d-flex gap-2">
                            <button type="button" id="btn-l1" onclick="cambiarLista(1)" class="btn btn-sm btn-primary btn-accion-tarea btn-lista">L1</button>
                            <button type="button" id="btn-l2" onclick="cambiarLista(2)" class="btn btn-sm btn-outline-primary btn-accion-tarea btn-lista">L2</button>
                            <button type="button" id="btn-l3" onclick="cambiarLista(3)" class="btn btn-sm btn-outline-primary btn-accion-tarea btn-lista">L3</button>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" onclick="agregarFilaTarea()" class="btn btn-sm btn-success btn-accion-tarea">
                                + Agregar Tarea
                            </button>
                            <button type="button" onclick="quitarFilaTarea()" class="btn btn-sm btn-outline-danger btn-accion-tarea">
                                - Quitar Tarea
                            </button>
                        </div>
                    </div>

                    <input type="hidden" name="tipo_lista" id="tipo_lista" value="1">

                    <div id="contenedor-tareas" class="d-flex flex-column gap-2 mt-2">
                        <div class="d-flex gap-2 align-items-center fila-tarea">
                            <select name="tareas" class="form-select input-personalizado" required>
                                <option value="" selected disabled data-nombre="Selecciona una tarea realizada..." data-precio1="precio1" data-precio2="precio2" data-precio3="precio3">
                                    Selecciona una tarea realizada...
                                </option>
                                {% for t in tareas %}
                                    <option value="{{ t['id_tarea'] }} " data-nombre="{{ t['nom_tar'] }}" data-precio1="{{ t['precio'] }}" data-precio2="{{ t['precio2'] }}" data-precio3="{{ t['precio3'] }}">
                                        {{ t['nom_tar'] }} &mdash; ${{ "{:,.2f}".format(t['precio']) }}
                                    </option>
                                {% endfor %}
                            </select>
                        
                            <!-- Control de cantidad -->
                            <div class="input-group" style="width: 130px;">
                                <button type="button" class="btn btn-outline-primary" onclick="modificarCantidad(this, -1)">-</button>
                                <input type="number" name="cantidades" class="form-control text-center input-cantidad" value="1" min="1" readonly>
                                <button type="button" class="btn btn-outline-primary" onclick="modificarCantidad(this, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. Botón Guardar / Enviar -->
                <div class="mt-5">
                    <div class="d-flex justify-content-between align-items-center mt-3 p-3 rounded-3" style="background-color:#eef2ff;">
                        <span class="fw-bold text-secondary text-uppercase small">Total Parcial</span>
                        <span id="total-parcial" class="fw-bold fs-5" style="color:#1a42b8;">$0.00</span>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow" style="background-color: #1a42b8; border: none; font-size: 1.05rem;">
                        Guardar Remito y Calcular Total
                    </button>
                </div>
                
            </form>
        </div>
    </main>

    <!-- Scripts para duplicar/quitar selects dinámicos -->
    <script>
        function agregarFilaTarea() {
            const contenedor = document.getElementById('contenedor-tareas');
            const primerFila = contenedor.querySelector('.fila-tarea');
            
            const nuevaFila = primerFila.cloneNode(true);
            nuevaFila.querySelector('select').selectedIndex = 0;
            
            // 1️⃣ PRIMERO insertamos la fila en la página
            contenedor.appendChild(nuevaFila);
            
            // 2️⃣ RECIÉN AHORA tocamos su valor, cuando ya está "conectada" y visible
            const inputCantidad = nuevaFila.querySelector('.input-cantidad');
            inputCantidad.value = 1;
            
            calcularTotal();
        }

        function quitarFilaTarea() {
            const contenedor = document.getElementById('contenedor-tareas');
            const filas = contenedor.querySelectorAll('.fila-tarea');
            if (filas.length > 1) {
                contenedor.removeChild(filas[filas.length - 1]);
            }
        
            calcularTotal();
        }

        function cambiarLista(numeroLista) {
            document.getElementById('tipo_lista').value = numeroLista;
            const contenedor = document.querySelectorAll('#contenedor-tareas select');
            for (let select of contenedor) {
                for (let opcion of select.options) {
                    const precio1 = opcion.getAttribute('data-precio1');
                    const precio2 = opcion.getAttribute('data-precio2');
                    const precio3 = opcion.getAttribute('data-precio3');
                    const nombre = opcion.getAttribute('data-nombre');
                    if (numeroLista === 1) {
                        opcion.textContent = `${nombre} — $${parseFloat(precio1).toFixed(2)}`;
                    } else if (numeroLista === 2) {
                        opcion.textContent = `${nombre} — $${parseFloat(precio2).toFixed(2)}`;
                    } else if (numeroLista === 3) {
                        opcion.textContent = `${nombre} — $${parseFloat(precio3).toFixed(2)}`;
                    }
                    if (opcion.value === "") {
                        opcion.textContent = "Selecciona una tarea realizada...";
                    }
                }
            }
            // 1. A todos los botones de lista les quitamos el azul relleno y les ponemos el borde
            document.querySelectorAll('.btn-lista').forEach(btn => {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-primary');
            });
            // 2. Al botón presionado le ponemos el azul relleno
            const botonActivo = document.getElementById(`btn-l${numeroLista}`);
            botonActivo.classList.remove('btn-outline-primary');
            botonActivo.classList.add('btn-primary');

            calcularTotal();
        }

        function modificarCantidad(boton, cambio) {
            // Buscamos el input de cantidad que está al lado de este botón
            const input = boton.parentElement.querySelector('.input-cantidad');
            let valorActual = parseInt(input.value) || 1;
            let nuevoValor = valorActual + cambio;
            
            // Evitamos que baje de 1
            if (nuevoValor >= 1) {
                input.value = nuevoValor;
            }
            calcularTotal();
        }

        function calcularTotal() {
            const filas = document.querySelectorAll('#contenedor-tareas .fila-tarea');
            const listaActual = document.getElementById('tipo_lista').value; // "1", "2" o "3"
            let total = 0;

            filas.forEach(fila => {
                const select = fila.querySelector('select');
                const cantidadInput = fila.querySelector('.input-cantidad');
                const opcionSeleccionada = select.options[select.selectedIndex];

                const precio = parseFloat(opcionSeleccionada.getAttribute(`data-precio${listaActual}`)) || 0;
                const cantidad = parseInt(cantidadInput.value) || 0;

                total += precio * cantidad;
            });

            document.getElementById('total-parcial').textContent =
                `$${total.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        document.getElementById('contenedor-tareas').addEventListener('change', function(e) {
        if (e.target.tagName === 'SELECT') {
            calcularTotal();
        }
    });
    </script>
</body>
</html>
