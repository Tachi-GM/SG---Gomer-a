<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Remito</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="{{ 'modo-milagritos' if milagritos else '' }}">

    <!-- BARRA SUPERIOR INSTITUCIONAL -->
    <header class="barra-superior py-3 px-4 shadow-sm mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="/" class="btn btn-sm btn-outline-light px-3 fw-bold rounded-pill">
                &larr; ATRÁS
            </a>
            <h1 class="h4 mb-0 text-uppercase fw-bold letter-spacing-1">
                Registro de Trabajos
            </h1>
            <a href="/toggle-milagritos" class="btn btn-modo-milagritos">
                🧚
            </a>
            <img src="/static/logo.png" alt="Gomería El Puente" class="logo-nav">
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container py-3 d-flex justify-content-center">
        <div class="tarjeta-formulario p-4 p-md-5">
            <h2 class="fs-4 fw-bold mb-4 text-dark text-start border-bottom pb-3">
                <span class="hada-decorativa">✨</span>Nuevo Remito de Trabajo<span class="hada-decorativa">✨</span>            
            </h2>
            
            <form action="/enviar-trabajo" method="POST">
                
                <!-- 1. Número de Remito -->
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-1">Número de Remito (Talonario)</label>
                    <input type="text" name="remito" class="form-control input-personalizado" placeholder="Ej: 20213" required>
                </div>

                <!-- 2. Nombre de Empresa -->
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-1">Empresa / Cliente</label>
                    <select name="empresa" class="form-select input-personalizado" required>
                        <option value="" selected disabled>Selecciona una empresa...</option>
                        {% for e in empresas %}
                            <option value="{{ e['id_cliente'] }}">{{ e['nom_cli'] }} (CUIT: {{ e['cuit'] }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- 3. Tareas Realizadas dinámicas -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label small fw-bold text-secondary text-uppercase mb-0">Tareas Realizadas</label>
                        <div class="d-flex gap-2">
                            <button type="button" id="btn-l1" onclick="cambiarLista(1)" class="btn btn-sm btn-primary btn-accion-tarea btn-lista">L1</button>
                            <button type="button" id="btn-l2" onclick="cambiarLista(2)" class="btn btn-sm btn-outline-primary btn-accion-tarea btn-lista">L2</button>
                            <button type="button" id="btn-l3" onclick="cambiarLista(3)" class="btn btn-sm btn-outline-primary btn-accion-tarea btn-lista">L3</button>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" onclick="agregarFilaTarea()" class="btn btn-sm btn-success btn-accion-tarea">
                                + Agregar Tarea
                            </button>
                            <button type="button" onclick="quitarFilaTarea()" class="btn btn-sm btn-outline-danger btn-accion-tarea">
                                - Quitar Tarea
                            </button>
                        </div>
                    </div>

                    <input type="hidden" name="tipo_lista" id="tipo_lista" value="1">

                    <div id="contenedor-tareas" class="d-flex flex-column gap-2 mt-2">
                        <div class="d-flex gap-2 align-items-center fila-tarea">
                            <select name="tareas" class="form-select input-personalizado" required>
                                <option value="" selected disabled data-nombre="Selecciona una tarea realizada..." data-precio1="precio1" data-precio2="precio2" data-precio3="precio3">
                                    Selecciona una tarea realizada...
                                </option>
                                {% for t in tareas %}
                                    <option value="{{ t['id_tarea'] }} " data-nombre="{{ t['nom_tar'] }}" data-precio1="{{ t['precio'] }}" data-precio2="{{ t['precio2'] }}" data-precio3="{{ t['precio3'] }}">
                                        {{ t['nom_tar'] }} &mdash; ${{ "{:,.2f}".format(t['precio']) }}
                                    </option>
                                {% endfor %}
                            </select>
                        
                            <!-- Control de cantidad -->
                            <div class="input-group" style="width: 130px;">
                                <button type="button" class="btn btn-outline-primary" onclick="modificarCantidad(this, -1)">-</button>
                                <input type="number" name="cantidades" class="form-control text-center input-cantidad" value="1" min="1" readonly>
                                <button type="button" class="btn btn-outline-primary" onclick="modificarCantidad(this, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. Botón Guardar / Enviar -->
                <div class="mt-5">
                    <div class="d-flex justify-content-between align-items-center mt-3 p-3 rounded-3" style="background-color:#eef2ff;">
                        <span class="fw-bold text-secondary text-uppercase small">Total Parcial</span>
                        <span id="total-parcial" class="fw-bold fs-5" style="color:#1a42b8;">$0.00</span>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow" style="background-color: #1a42b8; border: none; font-size: 1.05rem;">
                        Guardar Remito y Calcular Total
                    </button>
                </div>
                
            </form>
        </div>
    </main>
    <script src="/static/js/mataburros.js"></script>
</body>
</html>
